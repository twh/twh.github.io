name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
        run: |
          hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      # Render the print view of the CV + Publications to a real PDF and stamp
      # the document properties (Title/Author/Subject/Keywords) that applicant
      # tracking systems read. Regenerated on every push so it cannot go stale.
      - name: Generate resume PDF
        run: |
          python3 -m pip install --quiet --upgrade pypdf
          (cd public && python3 -m http.server 8899 >/dev/null 2>&1 &)
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8899/downloads/ >/dev/null && break
            sleep 0.5
          done
          google-chrome --headless=new --disable-gpu --no-sandbox \
            --print-to-pdf=/tmp/resume_raw.pdf --no-pdf-header-footer \
            --virtual-time-budget=10000 \
            "http://127.0.0.1:8899/downloads/"
          mkdir -p public/files
          python3 .github/scripts/pdf_meta.py \
            public/downloads/index.html /tmp/resume_raw.pdf \
            public/files/wayne-hendricks-cv.pdf
          ls -la public/files/wayne-hendricks-cv.pdf

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
